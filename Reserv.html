<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservation</title>
    <link rel="stylesheet" href="Reserv.css" />
  </head>
  <body>
    <div class="ad">
      <h4>Get 10% Off on your first app order. Start Now</h4>
    </div>
    <div class="nav">
      <div class="logo">
        <h1 id="main"><b>Annam Café</b></h1>
        <p id="light">South Indian Restaurant</p>
      </div>
      <div class="tabs">
        <a id="tab" href="">Our Story</a>
        <a id="tab" href="Menu.html" target="_blank">Menu</a>
        <a id="tab" href="">Order Online</a>
        <a id="tab" href="">Catering</a>
        <a id="tab" href="">Contact & Reservation</a>
        <a id="tab" href="">Login</a>
      </div>
    </div>
    <div class="res">
      <img src="Media/Images/res.jpg" alt="img" />

      <div class="form">
        <form action="">
          <h1 class="formhead">Book a Table</h1>
          <label for="name">Name</label><br />
          <input type="text" name="name" id="name" /><br />
          <label for="size">Party Size</label>
          <select name="size" id="size">
            <option value="1">1 guest</option>
            <option value="2">2 guests</option>
            <option value="2">3 guests</option>
            <option value="4">4 guests</option>
            <option value="5">5 guests</option>
          </select>
          <label for="date">Date</label><br />
          <input type="date" name="" id="" /><br />
          <label for="time">Time</label><br />
          <input type="time" name="time" id="time" /><br />

          <button type="submit">Book Now</button>
        </form>
      </div>
    </div>
  </body>
</html>
